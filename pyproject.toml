[project]
name = "pmigrate"
version = "0.1.0"
description = "Autonomous Pydantic v1->v2 codebase migration agent"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "tree-sitter>=0.21",
    "tree-sitter-python>=0.21",
    "libcst>=1.1",
    "neo4j>=5.19",
    "docker>=7.0",
    "langgraph>=0.1",
    "anthropic>=0.30",
    "openai>=1.30",
    "PyGithub>=2.3",
    "requests>=2.31",
    "pytest>=8.0",
    "pytest-json-report>=1.5",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "structlog>=24.1",
    "typer>=0.12",
    "tenacity>=8.2",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "pytest-cov>=5.0",
]

[project.scripts]
pmigrate = "pmigrate.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pmigrate"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
exclude = ["tests/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
