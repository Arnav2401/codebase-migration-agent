[project]
name = "pmigrate"
version = "0.1.0"
description = "Autonomous Pydantic v1->v2 codebase migration agent"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "tree-sitter>=0.21",
    "tree-sitter-python>=0.21",
    "libcst>=1.1",
    "neo4j>=5.19",
    "docker>=7.0",
    "langgraph>=0.1",
    "anthropic>=0.30",
    "openai>=1.30",
    "PyGithub>=2.3",
    "requests>=2.31",
    "pytest>=8.0",
    "pytest-json-report>=1.5",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "structlog>=24.1",
    "typer>=0.12",
    "tenacity>=8.2",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "pytest-cov>=5.0",
]
# docs/decisions.md D61: local embeddings for Phase 5's "embedding" retrieval arm --
# chosen over a paid provider (OpenAI/Gemini) specifically to avoid a fourth
# provider-quota crisis after Gemini's trickle-refill (D48) and Groq's daily-token
# exhaustion (D53) both hit this project the same day. Optional, not core: most of this
# project (T1, triage, the graph/wholefile retrieval arms) has no reason to force a
# multi-hundred-MB torch install. `pip install -e '.[embedding]'` to use it.
embedding = [
    "sentence-transformers>=2.2",
]

[project.scripts]
pmigrate = "pmigrate.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pmigrate"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["tests/graph/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
exclude = ["tests/"]

# `sentence-transformers` is the optional `embedding` extra (D61), so whether it is
# importable depends on which install the checkout got -- `make setup` installs only
# `.[dev]` and leaves it absent. An inline `# type: ignore[import-not-found]` on the
# import can only ever be right for ONE of those two states: with the package absent it
# silences a real missing-stub error, and with it installed `strict`'s own
# warn_unused_ignores flags that same comment as unused. Found live: installing the extra
# to unblock the embedding eval arm turned a clean `mypy src/pmigrate` into a failing one
# without a single source line changing. This override is state-independent -- it silences
# the missing-import error when the package isn't there and says nothing when it is.
[[tool.mypy.overrides]]
module = "sentence_transformers.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/fixtures/hostile/ asserts a CONTAINER's confinement (no network, read-only root,
# non-root uid). Those assertions are false on a developer laptop by construction, so the
# host run must not collect them -- they are exercised inside the sandbox, and their FLAGS
# are asserted on the host by tests/sandbox/test_hostile_policy.py (docs/decisions.md D97).
norecursedirs = ["tests/fixtures"]
# TestOutcome/TestRun (types.py) are plain dataclasses that happen to start with "Test" —
# pytest's default class-collection heuristic (`Test*`) flags them and warns that they
# can't be collected (they have __init__). Every test in this project is a bare function
# (`def test_...`), never a class, so disabling class-based collection entirely is exactly
# right here, not just a warning suppression.
python_classes = []
